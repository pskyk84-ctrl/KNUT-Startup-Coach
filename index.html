<!DOCTYPE html>

<style>
:root{--navy:#1F3864;--blue:#2E5C99;--soft:#E8F0FA;--bg:#F4F7FB;--card:#fff;--line:#D9E2EF;--txt:#27323F;--mute:#6B7A8D;--ok:#1E8E5A;--okbg:#E6F5EE;--warn:#B96A00;--warnbg:#FFF4E0;--err:#C0392B;--errbg:#FDECEA;--rad:12px}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--txt);line-height:1.6;font-size:15px}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit;font-size:15px}
.top{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 20px}
.top .menu{display:none;background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:4px 10px;font-size:16px}
.brand{display:flex;flex-direction:column;line-height:1.25}
.brand b{font-size:16px}
.brand span{font-size:12px;opacity:.8}
.prog{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:180px}
.bar{flex:1;height:8px;background:rgba(255,255,255,.25);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:#6FD3A0;transition:width .3s}
#pct{font-size:13px;font-weight:700;min-width:36px;text-align:right}
.saved{font-size:11px;opacity:.75;min-width:70px;text-align:right}
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px;max-width:1180px;margin:0 auto;padding:22px 18px 60px}
.side{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 80px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:10px}
.sg{font-size:11px;font-weight:700;color:var(--mute);letter-spacing:.04em;padding:10px 10px 4px}
.si{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;border:0;border-radius:8px;padding:8px 10px;color:var(--txt);font-size:14px}
.si:hover{background:var(--soft)}
.si.cur{background:var(--soft);font-weight:700;color:var(--navy)}
.si .dot{flex:0 0 14px;height:14px;border-radius:50%;border:2px solid #B8C4D6;background:#fff}
.si.done .dot{background:var(--ok);border-color:var(--ok)}
.si.cur .dot{border-color:var(--blue)}
.si span{flex:1}
.si em{font-style:normal;font-size:10px;color:var(--mute);border:1px solid var(--line);border-radius:10px;padding:0 6px}
.main{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:22px 24px;margin-bottom:16px}
.qhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.qno{background:var(--navy);color:#fff;border-radius:8px;padding:2px 10px;font-weight:800;font-size:14px}
.qhead h2{margin:0;font-size:20px;color:var(--navy);flex:1;min-width:200px}
.req{font-size:12px;border-radius:12px;padding:2px 10px;background:var(--soft);color:var(--blue);font-weight:700}
.req.must{background:#FDE9E7;color:var(--err)}
h1.big{font-size:26px;color:var(--navy);margin:4px 0 8px;line-height:1.35}
h3{margin:0 0 8px;color:var(--navy);font-size:16px}
.sub{color:var(--mute);margin:0 0 14px}
details.guide{background:#F8FAFD;border:1px solid var(--line);border-radius:10px;padding:10px 16px;margin-bottom:18px}
details.guide summary{cursor:pointer;font-weight:700;color:var(--blue)}
.gl{margin:10px 0 0;font-size:14px}
.gl b{color:var(--navy)}
.ex{margin-top:10px;background:#fff;border-left:4px solid #9DB8DD;padding:8px 12px;border-radius:0 8px 8px 0;font-size:14px;color:#44566B}
.ex small{display:block;color:var(--mute);font-weight:700;margin-bottom:2px}
.f{margin-bottom:18px}
.lab{display:block;font-weight:700;margin-bottom:6px;color:var(--navy)}
.lab em{font-style:normal;font-size:11px;color:var(--err);margin-left:6px}
.hint{font-size:12.5px;color:var(--mute);margin-top:4px}
.inp,textarea.inp{width:100%;border:1px solid #C4D0E0;border-radius:9px;padding:9px 12px;background:#fff;color:var(--txt)}
.inp:focus,textarea:focus{outline:2px solid #9DB8DD;border-color:var(--blue)}
textarea.inp{min-height:84px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid #C4D0E0;background:#fff;color:var(--txt);border-radius:20px;padding:6px 13px;font-size:14px}
.chip:hover{border-color:var(--blue)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.per{display:flex;gap:10px;align-items:center;margin-top:8px}
.per>span{flex:0 0 150px;font-size:13px;font-weight:700;color:var(--blue)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:9px;padding:8px 14px;font-weight:700;font-size:14px}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:var(--blue)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.info{background:var(--soft);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:18px}
.info a,.link{color:var(--blue);text-decoration:underline;cursor:pointer;background:none;border:0;padding:0;font-size:inherit}
.prev{background:#FBFCFE;border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:6px}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-weight:700;color:var(--navy)}
.cnt{margin-left:auto;font-size:13px;font-weight:700;color:var(--ok)}
.cnt.bad{color:var(--err)}
.cnt.low{color:var(--warn)}

.coach{list-style:none;margin:12px 0 0;padding:0;font-size:13.5px}
.coach li{padding:4px 0 4px 26px;position:relative}
.coach li:before{content:'';position:absolute;left:4px;top:9px;width:12px;height:12px;border-radius:50%;background:#C4D0E0}
.coach li.ok:before{background:var(--ok)}
.coach li.no:before{background:var(--err)}
.coach li.nt:before{background:#9DB8DD}
.box{border-radius:10px;padding:10px 14px;font-size:14px;margin-top:10px}
.box.ok{background:var(--okbg);color:#14633F}
.box.warn{background:var(--warnbg);color:var(--warn)}
.box.err{background:var(--errbg);color:var(--err)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
.diag{margin-bottom:16px}
.diag .dq{font-weight:700;margin-bottom:6px;color:var(--navy)}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;border:1px solid #C4D0E0;background:#fff;border-radius:9px;padding:9px 12px;font-size:14px}
.opt:hover{border-color:var(--blue)}
.opt.on{background:var(--soft);border-color:var(--blue);font-weight:700;color:var(--navy)}
.tracks{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.tcard{border:2px solid var(--line);border-radius:12px;padding:14px 16px;background:#fff;text-align:left}
.tcard:hover{border-color:var(--blue)}

.badge{display:inline-block;background:var(--ok);color:#fff;font-size:11px;border-radius:10px;padding:1px 8px;margin-left:6px;vertical-align:middle}
.score{margin-bottom:14px}
.srow{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.srow b{min-width:200px;color:var(--navy)}
.sbar{flex:1;height:12px;background:#E3EAF4;border-radius:8px;overflow:hidden}
.sbar i{display:block;height:100%;background:var(--blue)}
.sval{min-width:130px;font-size:13px;font-weight:700;text-align:right}
.ask{margin:4px 0 0 0;padding-left:20px;font-size:13.5px;color:#44566B}

.cl{list-style:none;margin:0;padding:0}

.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left}
.tbl th{background:var(--soft);color:var(--navy)}
.pill{font-size:12px;padding:1px 9px;border-radius:10px;font-weight:700}
.pill.ok{background:var(--okbg);color:#14633F}
.pill.no{background:var(--errbg);color:var(--err)}
.pill.op{background:#EEF1F6;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1b2433;color:#fff;border-radius:22px;padding:9px 20px;font-size:14px;z-index:99;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:.95}
.who{font-size:13px;opacity:.9;white-space:nowrap}
.top .lo{border-color:rgba(255,255,255,.5);color:#fff;background:transparent}
.top .lo:hover{background:rgba(255,255,255,.15)}
.fb{background:#FFF7E0;border:1px solid #F0D58A;border-radius:10px;padding:10px 14px;margin-top:14px;white-space:pre-wrap;font-size:14px}
.fb b{color:#8A5A00;display:block;margin-bottom:2px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.consent{background:#F8FAFD;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13.5px;margin-bottom:10px}
.consent li{margin-bottom:3px}
.rv{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:12px}
.rvh{font-weight:700;color:var(--navy);margin-bottom:4px}
.rvs{font-size:13.5px;margin-bottom:6px}
.rvl{margin:6px 0;padding-left:18px;font-size:13.5px}
.rvl li{margin-bottom:5px}
.rvl.w{list-style:none;padding-left:0}
.rvl.w li{border-left:4px solid #9DB8DD;padding:3px 10px;background:#F8FAFD;border-radius:0 8px 8px 0}
.rvl.w li.warn{border-left-color:var(--err);background:var(--errbg)}
.rvl del{color:var(--err);background:#FDECEA;text-decoration:line-through}
.rvl ins{color:#14633F;background:var(--okbg);text-decoration:none}
.aig{background:#F8FAFD;border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin-top:12px;font-size:14px}
.aig summary{cursor:pointer;font-weight:700;color:var(--blue)}
.aig ul{margin:6px 0;padding-left:18px}
.aig li{margin-bottom:4px}
.adg{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin-bottom:10px}
.adg>summary{cursor:pointer;font-weight:700;color:var(--navy);padding:4px 0}
.adi{border-top:1px dashed var(--line);padding:10px 0}
.adl{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;color:var(--blue);margin-bottom:5px}
.adl>span:first-child{flex:1}
.adb{display:none;font-size:11px;background:#FFF1C9;color:#8A5A00;border-radius:10px;padding:0 8px}
.adi.mod .adb{display:inline}
.adi.mod textarea{border-color:#E0B040;background:#FFFDF4}
.foot{text-align:center;color:var(--mute);font-size:12px;margin-top:20px}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
.steps3 div{background:var(--soft);border-radius:10px;padding:12px 14px;font-size:14px}
.steps3 b{display:block;color:var(--navy);margin-bottom:2px}
@media(max-width:860px){
 .wrap{grid-template-columns:1fr;padding:14px 12px 50px}
 .top .menu{display:block}
 .side{display:none;position:fixed;top:56px;left:8px;right:8px;z-index:40;max-height:70vh;box-shadow:0 10px 30px rgba(0,0,0,.25)}
 body.sideopen .side{display:block}
 .tracks,.steps3{grid-template-columns:1fr}
 .srow{flex-wrap:wrap}.srow b{min-width:100%}
 .per{flex-direction:column;align-items:stretch}.per>span{flex:none}
 .card{padding:16px}
 .brand span{display:none}.prog{min-width:110px}.saved{display:none}
}
@media print{.top,.side,.nav,.btnrow,.toast{display:none!important}.wrap{display:block}}
</style>

function diagResult(){
  var L=0,T=0,n=0;
  DIAG.forEach(function(d){var j=S.diag[d.id]; if(j!=null){n++;L+=d.o[j][1];T+=d.o[j][2];}});
  var rec=null;
  if(n===DIAG.length){
    if(L-T>=2)rec='local'; else if(T-L>=2)rec='tech';
    else{var j4=S.diag.d4; rec=j4===0?'local':j4===2?'tech':'mixed';}
  }
  return {L:L,T:T,n:n,rec:rec};
}

{id:'Q4-1',no:'Q4-1',short:'사업화 계획',title:'아이디어를 어떻게 사업화 하실 계획인가요?',req:true,max:2000,kind:'text',rows:11,

 example:'실현은 3단계입니다. 1단계 실증 - 한 개 동 복지관과 협력해 시범 운영하며 사용성 검증. 2단계 확장 검증 - 인근 가맹점 20~30곳으로 확장. 3단계 확산 - 다른 지역 지자체·복지관과 제휴. 라운드 지원금은 음성 안내 기능 고도화에 사용.',

  {k:'metric',type:'text',label:'검증이 “성공”이라고 판단할 기준',placeholder:'예: 시범 이용자 30명, 재사용률 40%'},

      else it.set(has&&Array.isArray(v)&&v.length?v.map(String):it.def.slice());
    }catch(e){}
  });
}
var CFG_KEY=KEY+'-cfg';
function applyCachedConfig(){try{var r=localStorage.getItem(CFG_KEY);if(r)applyOverrides(JSON.parse(r));}catch(e){}}
function typingNow(){var a=document.activeElement;return !!(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'));}
function fetchConfig(){
  if(!SERVER)return;
  fetch(CONFIG.apiUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'config'})})
   .then(function(r){return r.json();}).then(function(j){
     if(!j||!j.ok)return;var c=(j.data&&j.data.config)||{};
     var before=JSON.stringify(REG.map(function(it){return it.get();}));
     applyOverrides(c);try{localStorage.setItem(CFG_KEY,JSON.stringify(c));}catch(e){}
     if(before!==JSON.stringify(REG.map(function(it){return it.get();}))&&!(S.admin&&ADM.dirty)&&!typingNow())rerender();
   }).catch(function(){});
}
/* ---------- 편집 화면 ---------- */
function admDef(it){return it.kind==='l'?it.def.join('\n'):it.def;}
function admCur(it){return it.kind==='l'?it.get().join('\n'):it.get();}
function admVal(it){return ADM.draft[it.key]!==undefined?ADM.draft[it.key]:admCur(it);}
function admRows(it,v){var n=it.kind==='l'?v.split('\n').length+1:Math.ceil(v.length/58)+1;return Math.max(2,Math.min(it.kind==='l'?16:10,n));}
function adminHeader(){return '<header class="top"><div class="brand"><b>관리자 모드 · 문구 편집</b><span>'+esc(CONFIG.title)+'</span></div><div class="prog"></div>'+authHTML()+'</header>';}
function renderAdmin(){
  var body='';
  if(!SERVER)body='<div class="box warn" style="margin:0">관리자 모드는 서버 연동(googleClientId·apiUrl 설정) 후에 사용할 수 있습니다.</div>';
  else if(!S.auth)body='<div class="info"><div style="margin-bottom:8px"><b>관리자 구글 계정으로 로그인하세요.</b></div><div id="gbtn2"></div></div>';
  else if(S.isAdmin===undefined)body='<div class="hint">권한을 확인하는 중…</div>';
  else if(!S.isAdmin)body='<div class="box err" style="margin:0">이 계정('+esc(S.auth.email)+')에는 관리자 권한이 없습니다.</div><div class="btnrow"><button class="btn" data-act="adm-close">학생 화면으로 돌아가기</button></div>';
  else{
    var groups=[],map={};REG.forEach(function(it){if(!map[it.group]){map[it.group]=[];groups.push(it.group);}map[it.group].push(it);});
    var mod=REG.filter(function(it){return admVal(it)!==admDef(it);}).length;
    body='<p class="sub">수정한 문구는 <b>[저장하고 학생에게 반영]</b>을 누르면 서버에 저장되어 학생이 접속할 때 적용됩니다. 학생이 이미 입력한 답변은 바뀌지 않습니다. 선택지 이름을 바꾸면 이전에 선택된 값은 그대로 남지만 목록에서는 선택 표시가 사라질 수 있으니, 운영 중에는 항목 추가를 권장합니다.</p>'
     +'<div class="btnrow" style="margin-bottom:12px"><button class="btn pri" data-act="adm-save">저장하고 학생에게 반영</button><button class="btn" data-act="adm-close">학생 화면 보기</button><button class="btn" data-act="adm-resetall" style="color:var(--err);border-color:var(--err)">전체 기본값으로 복원</button><span class="hint" id="admmsg" style="align-self:center">'+esc(ADM.msg||(mod?'저장되지 않은 수정 '+mod+'건':''))+'</span></div>';
    groups.forEach(function(gn){
      var its=map[gn],m=its.filter(function(it){return admVal(it)!==admDef(it);}).length;
      body+='<details class="adg" data-g="'+esc(gn)+'"'+(ADM.open[gn]?' open':'')+'><summary>'+esc(gn)+' <span class="hint">('+its.length+'개'+(m?' · 수정 '+m+'건':'')+')</span></summary>';
      its.forEach(function(it){
        var v=admVal(it),isMod=v!==admDef(it);
        body+='<div class="adi'+(isMod?' mod':'')+'"><div class="adl"><span>'+esc(it.label)+'</span><span class="adb">수정됨</span><button type="button" class="btn sm" data-act="adm-reset" data-k="'+esc(it.key)+'">기본값 복원</button></div>'
          +'<textarea class="inp" data-ak="'+esc(it.key)+'" rows="'+admRows(it,v)+'">'+esc(v)+'</textarea>'
          +(it.kind==='l'?'<div class="hint">한 줄에 항목 1개'+(it.need?' · ‘'+esc(it.need)+'’ 항목은 반드시 유지':'')+'</div>':'')+'</div>';
      });
      body+='</details>';
    });
  }
  return '<div class="card" style="max-width:900px;margin:22px auto"><div class="qhead"><span class="qno">관리</span><h2>문구 편집</h2></div>'+body+'</div>';
}
function adminLayout(){return adminHeader()+'<div class="wrap" style="display:block;max-width:960px"><main class="main">'+renderAdmin()+'</main></div>';}
function admEdit(key,val){
  ADM.draft[key]=val;ADM.dirty=true;ADM.msg='';
  var it=REG.filter(function(x){return x.key===key;})[0];if(!it)return;
  var el=document.querySelector('[data-ak="'+key.replace(/"/g,'')+'"]'),box=el&&el.closest('.adi');
  if(box)box.classList.toggle('mod',val!==admDef(it));
  var m=document.getElementById('admmsg');if(m)m.textContent='저장되지 않은 수정이 있습니다';
}
function admReset(key){
  var it=REG.filter(function(x){return x.key===key;})[0];if(!it)return;
  var el=document.querySelector('[data-ak="'+key.replace(/"/g,'')+'"]');if(el)el.value=admDef(it);admEdit(key,admDef(it));
}
function admCollect(){
  var ov={},bad='';
  REG.forEach(function(it){
    if(bad)return;var v=admVal(it);if(v===admDef(it))return;
    if(it.kind==='l'){
      var a=v.split('\n').map(function(x){return x.trim();}).filter(Boolean);
      if(!a.length){bad=it.label+': 항목이 비어 있습니다.';return;}
      if(it.need&&a.indexOf(it.need)<0){bad=it.label+': ‘'+it.need+'’ 항목이 필요합니다.';return;}
      if(a.some(function(x){return x.length>200;})){bad=it.label+': 항목이 너무 깁니다(200자 이하).';return;}
      ov[it.key]=a;
    }else{
      var s=String(v).replace(/\s+$/,'');
      if(!s.trim()){bad=it.label+': 빈 문구는 저장할 수 없습니다. 기본값 복원을 사용하세요.';return;}
      if(s.length>4000){bad=it.label+': 문구가 너무 깁니다(4000자 이하).';return;}
      ov[it.key]=s;
    }
  });
  return {ov:ov,bad:bad};
}
function admSave(){
  if(ADM.saving)return;var r=admCollect();
  if(r.bad){toast(r.bad);ADM.msg=r.bad;var m=document.getElementById('admmsg');if(m)m.textContent=r.bad;return;}
  if(JSON.stringify(r.ov).length>40000){toast('수정 내용이 너무 많아 저장할 수 없습니다');return;}
  ADM.saving=true;ADM.msg='저장 중…';var m0=document.getElementById('admmsg');if(m0)m0.textContent=ADM.msg;
  api('adminSave',{config:r.ov}).then(function(j){
    ADM.saving=false;var c=(j.data&&j.data.config)||r.ov;applyOverrides(c);
    try{localStorage.setItem(CFG_KEY,JSON.stringify(c));}catch(e){}
    ADM.draft={};ADM.dirty=false;ADM.msg='저장했습니다 '+hhmm()+' · 학생이 다음에 접속할 때부터 적용됩니다';toast('학생 화면에 반영되도록 저장했어요');rerender();
  }).catch(function(e){ADM.saving=false;var mm=String(e&&e.message||e);ADM.msg=mm==='NOT_ADMIN'?'관리자 권한이 없습니다':'저장하지 못했어요 ('+mm+')';var m=document.getElementById('admmsg');if(m)m.textContent=ADM.msg;if(mm==='TOKEN_EXPIRED'||mm==='TOKEN_INVALID')handleApiError(e);});
}
function admResetAll(){
  if(!window.confirm('모든 문구를 기본값으로 되돌립니다(저장 버튼을 눌러야 학생에게 반영됩니다). 진행할까요?'))return;
  REG.forEach(function(it){ADM.draft[it.key]=admDef(it);});ADM.dirty=true;ADM.msg='저장되지 않은 수정이 있습니다';rerender();
}
function admClose(){
  if(ADM.dirty&&!window.confirm('저장하지 않은 수정이 있습니다. 버리고 나갈까요?'))return;
  ADM.draft={};ADM.dirty=false;ADM.msg='';S.admin=false;
  if(location.hash==='#admin')history.replaceState(null,'',location.pathname+location.search);
  render();
}
function syncAdminHash(){var on=(location.hash==='#admin');if(on!==!!S.admin){S.admin=on;render();}}

/* ================= 동작 ================= */
function copyText(t,msg){
  function fb(){var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');toast(msg||'복사했어요');}catch(e){toast('복사하지 못했어요. 직접 선택해 복사하세요');}document.body.removeChild(a);}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){toast(msg||'복사했어요');},fb);else fb();
}
function rerender(){var y=window.scrollY;render();window.scrollTo(0,y);}
function goStep(i){
  if(i<0||i>=STEPS.length)return;
  S.step=i;S.seen[STEPS[i].id]=true;rv=null;persist();render();window.scrollTo(0,0);
}
function download(name,blob){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);document.body.removeChild(a);},500);}
function stamp(){return todayStr().replace(/\./g,'');}
function allText(){
  return QS.map(function(q){var t=final(q).trim();return q.no+'. '+q.title+'\n'+(t||'(미작성)');}).join('\n\n');
}
function curQ(){var s=STEPS[S.step];return s.q||null;}
function doImport(){
  var inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=function(){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{applySnap(JSON.parse(r.result));S.step=0;persist();render();toast('불러왔어요');}catch(e){toast('백업 파일을 읽지 못했어요');}};r.readAsText(f);};
  inp.click();
}
function onClick(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var act=t.dataset.act,k=t.dataset.k,v=t.dataset.v;
  switch(act){
   case 'side':document.body.classList.toggle('sideopen');break;
   case 'adm-save':admSave();break;
   case 'adm-close':admClose();break;
   case 'adm-reset':admReset(k);break;
   case 'adm-resetall':admResetAll();break;
   case 'logout':doLogout();break;
   case 'srvsave':serverSave(true);break;
   case 'srvsubmit':serverSubmit();break;
   case 'srvrefresh':serverRefresh();break;
   case 'srvdelete':serverDelete();break;
   case 'go':goStep(t.dataset.id?stepIndex(t.dataset.id):+t.dataset.i);break;
   case 'next':goStep(S.step+1);break;
   case 'prev':goStep(S.step-1);break;
   case 'start':S.seen.intro=true;goStep(1);break;
   case 'chip':A[k]=(A[k]===v?'':v);persist();rerender();break;
   case 'mchip':
    var a=arr(k).slice(),i=a.indexOf(v),mx=+t.dataset.max||0;
    if(i>=0)a.splice(i,1);else{if(mx&&a.length>=mx){toast('최대 '+mx+'개까지 고르는 것을 권장해요');break;}a.push(v);}
    A[k]=a;persist();rerender();break;
   case 'diag':
    S.diag[t.dataset.i]=+t.dataset.j;
    var r=diagResult();if(r.rec&&r.rec!=='mixed'&&!S.trackTouched)S.track=r.rec;
    persist();rerender();break;
   case 'track':S.track=v;S.trackTouched=true;persist();rerender();break;
   case 'top':A.topIdx=v;persist();refresh();break;
   case 'review':runReview();break;
   case 'rv-apply':applyReview();break;
   case 'rv-undo':undoReview();break;
   case 'copy-prompt':var qq=curQ(),tt=$('#final');if(qq&&tt)copyText(buildPrompt(qq,tt.value),'프롬프트를 복사했어요. 사용하는 AI에 붙여 넣으세요');break;
   case 'copy':var q=curQ();if(q)copyText(final(q),q.no+' 답변을 복사했어요');break;
   case 'rebuild':var q2=curQ();if(q2){S.edited[q2.id]=false;delete S.text[q2.id];persist();refresh();toast('자동 초안으로 다시 조립했어요');}break;
   case 'chk':S.check[t.dataset.id]=!S.check[t.dataset.id];persist();rerender();break;
   case 'docx':
    try{download('모두의창업_도전신청서_초안_'+stamp()+'.docx',new Blob([buildDocx()],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'}));toast('Word 파일을 저장했어요');}
    catch(err){toast('Word 파일 생성에 실패했어요');}break;
   case 'copyall':copyText(allText(),'전체 문항을 복사했어요');break;
   case 'export':download('도전신청서코치_백업_'+stamp()+'.json',new Blob([snapshot()],{type:'application/json'}));toast('백업 파일을 저장했어요');break;
   case 'import':doImport();break;
   case 'reset':
    if(window.confirm('입력한 모든 내용이 지워집니다. 처음부터 다시 시작할까요?')){
     resetState();
     try{localStorage.removeItem(KEY);}catch(e2){} mem=null;render();}
    break;
  }
}
function onInput(e){
  var t=e.target;
  if(t.dataset&&t.dataset.ak){admEdit(t.dataset.ak,t.value);return;}
  if(t.dataset.final){S.text[t.dataset.final]=t.value;S.edited[t.dataset.final]=true;persistSoon();refresh();return;}
  if(t.dataset.p){S.profile[t.dataset.p]=(t.type==='checkbox')?t.checked:t.value;persistSoon();refresh();return;}
  var k=t.dataset.k;if(!k)return;
  A[k]=(t.type==='checkbox')?t.checked:t.value;
  persistSoon();refresh();
}
function init(){
  app=document.getElementById('app');
  buildRegistry();applyCachedConfig();
  loadSaved();S.step=0;lastSig=sigNow();
  S.admin=(location.hash==='#admin');
  render();
  loadGsi();fetchConfig();
  window.addEventListener('hashchange',syncAdminHash);
  app.addEventListener('toggle',function(e){var g=e.target&&e.target.dataset&&e.target.dataset.g;if(g)ADM.open[g]=e.target.open;},true);
  app.addEventListener('click',onClick);
  app.addEventListener('input',onInput);
  app.addEventListener('change',onInput);
  window.__COACH={ADM:ADM,REG:REG,TX:TX,applyOverrides:applyOverrides,admCollect:admCollect,onCredential:onCredential,serverLoad:serverLoad,serverSave:serverSave,SERVER:SERVER,CONFIG:CONFIG,S:S,QS:QS,reviewText:reviewText,buildPrompt:buildPrompt,STEPS:STEPS,final:final,qDone:qDone,scoreP:scoreP,buildDocx:buildDocx,docBody:docBody,diagResult:diagResult,progress:progress,josa:josa,render:render,refresh:refresh,setAns:function(o){Object.keys(o).forEach(function(k){S.ans[k]=o[k];});},CRIT:CRIT,CHECKS:CHECKS,chkOn:chkOn,allText:allText};
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();

</script>
